<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Datting app">

  <!-- Viewport meta tag - CRITICAL for iOS Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bondy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bondy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading indicator while Flutter initializes */
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFBF9;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFFBF9 50%, #FFF0E8 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .loading-text {
      color: #E8613C;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .loading-subtitle {
      color: #999;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #FFE0D4;
      border-top: 3px solid #E8613C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <!-- Loading indicator shown while Flutter boots up -->
  <div id="loading" class="loading-container">
    <img src="icons/Icon-192.png" alt="Bondy" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-text">Bondy</div>
    <div class="loading-subtitle">Đang tải ứng dụng...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    // Clear any stale service workers that might interfere
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
          console.log('Cleared active service worker.');
        }
      });
    }
  </script>
  <script>
    var flutterLoaded = false;
    var errorShown = false;

    // Hide loading screen once Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      flutterLoaded = true;
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.3s ease';
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 300);
      }
    });

    // Catch any fatal errors during Flutter initialization
    window.addEventListener('error', function(e) {
      console.error('Global JS error:', e);
      if (!flutterLoaded && !errorShown) {
        showError(e.error || new Error(e.message || 'Unknown global error'));
      }
    });

    // Catch promise rejections (very common in async initialization)
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled rejection:', e);
      if (!flutterLoaded && !errorShown) {
        showError(e.reason || new Error('Unhandled Promise rejection'));
      }
    });

    // Fallback: if Flutter hasn't loaded after 20 seconds, show error
    setTimeout(function() {
      if (!flutterLoaded && !errorShown) {
        showError(new Error('Flutter initialization timed out after 20 seconds.'));
      }
    }, 20000);

    function showError(err) {
      errorShown = true;
      var loading = document.getElementById('loading');
      if (loading) {
        var subtitle = loading.querySelector('.loading-subtitle');
        var spinner = loading.querySelector('.loading-spinner');
        if (subtitle) {
          var errorMsg = 'Không thể tải ứng dụng. Vui lòng thử lại.';
          var details = '';
          if (err) {
            details = err.stack || err.message || String(err);
          }
          subtitle.innerHTML = errorMsg + '<br><div id="error-details" style="margin-top: 15px; padding: 10px; background: rgba(255, 59, 48, 0.08); border: 1px solid rgba(255, 59, 48, 0.2); border-radius: 8px; color: #d32f2f; font-size: 11px; font-family: monospace; text-align: left; max-width: 90%; word-break: break-all; overflow-x: auto; white-space: pre-wrap; line-height: 1.4; display: inline-block;">' + escapeHtml(details) + '</div>';
        }
        if (spinner) {
          spinner.style.display = 'none';
        }
        
        // Remove existing reload button if present to avoid duplicates
        var existingBtn = loading.querySelector('.reload-btn');
        if (!existingBtn) {
          var btn = document.createElement('button');
          btn.className = 'reload-btn';
          btn.textContent = 'Tải lại trang';
          btn.style.cssText = 'margin-top:20px;padding:12px 32px;border:none;border-radius:24px;background:#E8613C;color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow: 0 4px 12px rgba(232,97,60,0.3);';
          btn.onclick = function() { location.reload(); };
          loading.appendChild(btn);
        }
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
