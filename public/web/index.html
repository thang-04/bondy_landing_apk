<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Datting app">

  <!-- Viewport meta tag - CRITICAL for iOS Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bondy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bondy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading indicator while Flutter initializes */
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFBF9;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFFBF9 50%, #FFF0E8 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .loading-text {
      color: #E8613C;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .loading-subtitle {
      color: #999;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #FFE0D4;
      border-top: 3px solid #E8613C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <!-- Loading indicator shown while Flutter boots up -->
  <div id="loading" class="loading-container">
    <img src="icons/Icon-192.png" alt="Bondy" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-text">Bondy</div>
    <div class="loading-subtitle">Đang tải ứng dụng...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    // Clear any stale service workers that might interfere
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
          console.log('Cleared active service worker.');
        }
      });
    }
  </script>
  <script>
    var flutterLoaded = false;

    // Hide loading screen once Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      flutterLoaded = true;
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.3s ease';
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 300);
      }
    });

    // Catch any fatal errors during Flutter initialization
    window.addEventListener('error', function(e) {
      console.error('Flutter load error:', e.message);
      if (!flutterLoaded) {
        showError();
      }
    });

    // Fallback: if Flutter hasn't loaded after 20 seconds, show error
    setTimeout(function() {
      if (!flutterLoaded) {
        showError();
      }
    }, 20000);

    function showError() {
      var loading = document.getElementById('loading');
      if (loading) {
        var subtitle = loading.querySelector('.loading-subtitle');
        var spinner = loading.querySelector('.loading-spinner');
        if (subtitle) {
          subtitle.textContent = 'Không thể tải ứng dụng. Vui lòng thử lại.';
          subtitle.style.color = '#E8613C';
        }
        if (spinner) {
          spinner.style.display = 'none';
        }
        // Add reload button
        var btn = document.createElement('button');
        btn.textContent = 'Tải lại trang';
        btn.style.cssText = 'margin-top:16px;padding:12px 32px;border:none;border-radius:24px;background:#E8613C;color:#fff;font-size:16px;font-weight:600;cursor:pointer;';
        btn.onclick = function() { location.reload(); };
        loading.appendChild(btn);
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
