<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bondy - Debug Test</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #FFFBF9; }
    .log { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 8px; font-size: 12px; word-break: break-all; }
    .error { background: #ffe0e0; color: #c00; }
    .success { background: #e0ffe0; color: #060; }
    h2 { color: #E8613C; }
  </style>
</head>
<body>
  <h2>Bondy Debug Test</h2>
  <p>Trang này kiểm tra khả năng load Flutter trên thiết bị của bạn.</p>
  <div id="logs"></div>

  <script>
    function log(msg, type) {
      var div = document.createElement('div');
      div.className = 'log ' + (type || '');
      div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
      document.getElementById('logs').appendChild(div);
    }

    // 1. Check WebGL support
    (function() {
      try {
        var canvas = document.createElement('canvas');
        var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
        if (gl) {
          var renderer = gl.getParameter(gl.RENDERER);
          var vendor = gl.getParameter(gl.VENDOR);
          log('WebGL OK: ' + renderer + ' (' + vendor + ')', 'success');
        } else {
          log('WebGL NOT supported!', 'error');
        }
      } catch(e) {
        log('WebGL error: ' + e.message, 'error');
      }
    })();

    // 2. Check WASM support
    (function() {
      try {
        if (typeof WebAssembly === 'object') {
          log('WebAssembly supported', 'success');
        } else {
          log('WebAssembly NOT supported!', 'error');
        }
      } catch(e) {
        log('WebAssembly error: ' + e.message, 'error');
      }
    })();

    // 3. Check WASM streaming compilation
    (async function() {
      try {
        log('Testing WASM fetch from /web/canvaskit/canvaskit.wasm...');
        var response = await fetch('/web/canvaskit/canvaskit.wasm');
        log('WASM fetch status: ' + response.status + ', Content-Type: ' + response.headers.get('content-type'));
        
        if (response.ok) {
          log('WASM file size: ' + response.headers.get('content-length') + ' bytes');
          try {
            var module = await WebAssembly.compileStreaming(fetch('/web/canvaskit/canvaskit.wasm'));
            log('WASM compileStreaming: SUCCESS', 'success');
          } catch(e) {
            log('WASM compileStreaming failed: ' + e.message, 'error');
            // Try ArrayBuffer fallback
            try {
              var resp2 = await fetch('/web/canvaskit/canvaskit.wasm');
              var buffer = await resp2.arrayBuffer();
              var module2 = await WebAssembly.compile(buffer);
              log('WASM compile (ArrayBuffer fallback): SUCCESS', 'success');
            } catch(e2) {
              log('WASM compile fallback also failed: ' + e2.message, 'error');
            }
          }
        } else {
          log('WASM fetch failed: ' + response.status, 'error');
        }
      } catch(e) {
        log('WASM test error: ' + e.message, 'error');
      }
    })();

    // 4. Check dynamic import of canvaskit.js
    (async function() {
      try {
        log('Testing dynamic import of /web/canvaskit/canvaskit.js...');
        var module = await import('/web/canvaskit/canvaskit.js');
        log('CanvasKit import: SUCCESS, default=' + typeof module.default, 'success');
      } catch(e) {
        log('CanvasKit import FAILED: ' + e.message, 'error');
      }
    })();

    // 5. Browser info
    log('UA: ' + navigator.userAgent);
    log('Vendor: ' + navigator.vendor);
    log('Platform: ' + navigator.platform);
  </script>
</body>
</html>
