services:
  landing:
    image: ghcr.io/thang-04/bondy_landing_apk:latest
    container_name: bondy_landing
    restart: unless-stopped
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
